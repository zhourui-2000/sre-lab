# HTTP：保留 ACME 验证，其余 301 跳 HTTPS
server {
    listen 80;
    server_name zhourui2000.online www.zhourui2000.online;

    # 健康检查端点：不参与跳转、不依赖 DNS/证书，只回答 nginx 与站点根是否可用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://zhourui2000.online$request_uri;
    }
}

# www 301 归一到主域
server {
    listen 443 ssl http2;

    server_name www.zhourui2000.online;

    ssl_certificate     /etc/letsencrypt/live/zhourui2000.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhourui2000.online/privkey.pem;

    return 301 https://zhourui2000.online$request_uri;
}

server {
    listen 443 ssl http2;

    server_name zhourui2000.online;

    ssl_certificate     /etc/letsencrypt/live/zhourui2000.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhourui2000.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
