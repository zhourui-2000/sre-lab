---
- name: 部署 fail2ban 配置
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: '0644'
  notify: restart fail2ban

- name: 确保 firewalld 开机并运行
  ansible.builtin.systemd:
    name: firewalld
    state: started
    enabled: true

- name: 放行 SSH 端口
  ansible.builtin.firewalld:
    port: 2222/tcp
    permanent: true
    state: enabled
  notify: reload firewalld

- name: 放行 HTTP
  ansible.builtin.firewalld:
    service: http
    permanent: true
    state: enabled
  notify: reload firewalld

- name: 放行 HTTPS
  ansible.builtin.firewalld:
    service: https
    permanent: true
    state: enabled
  notify: reload firewalld

- name: 确保 fail2ban 开机并运行
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true

- name: 加固 SSH 服务
  ansible.builtin.include_tasks: sshd.yml
