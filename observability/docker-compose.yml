services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VM_VER}
    container_name: victoriametrics
    command:
      - '--storageDataPath=/vmdata'
      - '--retentionPeriod=30d'
      - '--memory.allowedPercent=20'
      - '--promscrape.config=/vmdata/scrape.yml'
    volumes:
      - ./vmdata:/vmdata
      - ./scrape.yml:/vmdata/scrape.yml:ro
    ports:
      - "127.0.0.1:8428:8428"
    # 2026-10-17 校准：实测 55–58 MB（4.4× 余量太松，收紧到 3.3×）
    mem_limit: 192m
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:${NE_VER}
    container_name: node-exporter
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    mem_limit: 64m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:${GF_VER}
    container_name: grafana
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana-data:/var/lib/grafana
      # 目的：数据源与面板「代码化」—— 此前只存在 grafana.db 里，删容器即丢
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    # 2026-10-17 校准：实测 82–99 MB（2.6× → 1.9×）
    mem_limit: 192m
    restart: unless-stopped

  vmalert:
    image: victoriametrics/vmalert:${VM_VER}    # 与 VictoriaMetrics 同版本，已在 2.0 拉齐
    container_name: vmalert
    command:
      - '--datasource.url=http://victoriametrics:8428'
      - '--rule=/rules/alert-rules.yml'
      - '--rule=/rules/slo-rules.yml'   # 目的：SLO 规则独立成文件 —— 改它不动主机规则，反之亦然
      - '--notifier.url=http://alertmanager:9093'
      - '--httpListenAddr=:8880'         # 目的：必须显式给，否则管理 API 不可达
      - '--remoteWrite.url=http://victoriametrics:8428'   # 目的：缺它则 ALERTS 不落库，VM 永远查不到
    volumes:
      - ./alert-rules.yml:/rules/alert-rules.yml:ro
      - ./slo-rules.yml:/rules/slo-rules.yml:ro
    ports:
      - "127.0.0.1:8880:8880"            # 目的：收口，别再重犯 0.0.0.0 的错
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      - victoriametrics

  alertmanager:
    image: quay.io/prometheus/alertmanager:${AM_VER}
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      # 密钥文件在仓库外，且目录 700 / 文件 644（见 docs/adr/0002）
      # ⚠️ 改完此文件必须 docker compose up -d --force-recreate alertmanager
      - /root/.sre-lab-secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 64m
    restart: unless-stopped

  loki:
    image: grafana/loki:${LOKI_VER}
    container_name: loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
      # ⚠️ 镜像以 uid 10001 运行（非 root）→ 宿主目录必须先 chown 10001，
      #    否则启动即 permission denied。固定动作见 docs/runbook.md
      - ./loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"           # 目的：收口，不暴露 0.0.0.0
    mem_limit: 192m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:${ALLOY_VER}
    container_name: alloy
    hostname: zhourui2000
    command:
      - 'run'
      - '/etc/alloy/config.alloy'
      - '--server.http.listen-addr=0.0.0.0:12345'    # 目的：UI 与 metrics 同样收口
      - '--storage.path=/var/lib/alloy/data'
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy-data:/var/lib/alloy/data
      - /var/log/journal:/var/log/journal:ro            # 目的：读 systemd journal
      - /etc/machine-id:/etc/machine-id:ro              # 目的：缺它 journal 源读不到内容
      - /var/run/docker.sock:/var/run/docker.sock:ro    # 目的：容器发现与元数据；权限取舍见 alloy-config.alloy 注释
    ports:
      - "127.0.0.1:12345:12345"
    # 2026-10-17 校准：实测 94–134 MB 且波动大；memory.events.max 累计 783 次
    # （跨周期观测 Δ=0 → 是 10-15 启动回灌期的一次性事件，非持续限流）。
    # 但 134/192 = 70% 余量过薄，放宽到 1.9×：这是本次唯一「加」而不是「减」的一项。
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      - loki

  # ── 外部可用性拨测（2026-10-19 · SLO 的 SLI 来源）──────────────
  # 为什么不进 k3s：① 2G 机已到边界（ArgoCD 落地后 available 338MB / swap 550MB），
  #   k8s 组件真实成本 ≈ Pod 占用的 3 倍；
  # ② 探针跑在被测平台里，报错时分不清「站点坏了」和「k3s 坏了」。
  # 决策全文见 docs/adr/0005-blackbox-on-docker-compose.md
  blackbox:
    image: quay.io/prometheus/blackbox-exporter:${BB_VER}
    container_name: blackbox
    command:
      - '--config.file=/config/blackbox.yml'
    volumes:
      # 探针模块是配置不是状态：只读挂载，没有写权限的需求
      - ./blackbox.yml:/config/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"      # 目的：收口；VM 走 compose 网络直抓，不必经宿主
    # 2026-10-19 初值：Go 程序空载约 20 MB，2× 余量。实测走 scripts/check-mem-budget.py
    mem_limit: 48m
    restart: unless-stopped
