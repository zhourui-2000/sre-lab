services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:${VM_VER}
    container_name: victoriametrics
    command:
      - '--storageDataPath=/vmdata'
      - '--retentionPeriod=30d'
      - '--memory.allowedPercent=20'
      - '--promscrape.config=/vmdata/scrape.yml'
    volumes:
      - ./vmdata:/vmdata
      - ./scrape.yml:/vmdata/scrape.yml:ro
    ports:
      - "127.0.0.1:8428:8428"
    mem_limit: 256m
    restart: unless-stopped

  node-exporter:
    image: quay.io/prometheus/node-exporter:${NE_VER}
    container_name: node-exporter
    command: ['--path.rootfs=/host']
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    mem_limit: 64m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    restart: unless-stopped
  vmalert:
    image: victoriametrics/vmalert:${VM_VER}    # 与 VictoriaMetrics 同版本，已在 2.0 拉齐
    container_name: vmalert
    command:
      - '--datasource.url=http://victoriametrics:8428'
      - '--rule=/rules/alert-rules.yml'
      - '--notifier.url=http://alertmanager:9093'
      - '--httpListenAddr=:8880'         # 目的：必须显式给，否则管理 API 不可达
      - '--remoteWrite.url=http://victoriametrics:8428'
    volumes:
      - ./alert-rules.yml:/rules/alert-rules.yml:ro
    ports:
      - "127.0.0.1:8880:8880"            # 目的：收口，别再重犯 0.0.0.0 的错
    mem_limit: 64m
    restart: unless-stopped
    depends_on:
      - victoriametrics

  alertmanager:
    image: quay.io/prometheus/alertmanager:${AM_VER}
    container_name: alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
#      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro      
      - /root/.sre-lab-secrets/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 64m
    restart: unless-stopped

